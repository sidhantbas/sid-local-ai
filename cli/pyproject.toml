[project]
name = "sid-cli"
version = "0.1.0"
description = "SID // LOCAL-AI: hacker-style launcher and clap-to-open for the local AI stack"
readme = "README.md"
authors = [
    { name = "sidhantbas", email = "79615340+sidhantbas@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pyobjc-framework-cocoa>=12.2.2",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
sid = "sid_cli.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
