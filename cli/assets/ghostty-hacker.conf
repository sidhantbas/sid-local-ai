# Ghostty config for the SID // LOCAL-AI hacker window (used only by `sid launch`;
# your normal Ghostty config still loads first, this file overrides it).
theme = Matrix
font-size = 15
background-opacity = 0.92
background-blur = true
fullscreen = true
macos-non-native-fullscreen = true
macos-titlebar-style = hidden
window-padding-x = 28
window-padding-y = 20
cursor-style = block
cursor-style-blink = true
title = SID // LOCAL-AI
confirm-close-surface = false
