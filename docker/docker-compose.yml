name: sid-local-ai

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"          # http://localhost:3000
    volumes:
      - open-webui:/app/backend/data
    environment:
      # No Ollama here; models are served on the host as OpenAI-compatible APIs:
      # Unsloth Studio (:8890, key from ../.env) and Strata (:8080, no key on this Mac).
      # Open WebUI only reads these on first start; afterwards its saved settings win.
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URLS=http://host.docker.internal:${UNSLOTH_PORT:-8890}/v1;http://host.docker.internal:${STRATA_PORT:-8080}/v1
      - OPENAI_API_KEYS=${UNSLOTH_API_KEY:-};none
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:9119:9119"   # dashboard: http://localhost:9119 (basic auth)
    volumes:
      # Named volume, not a ~/.hermes bind mount: Hermes warns that SQLite on
      # virtiofs (Colima's mount type) can corrupt. Model config lives in here
      # (model.provider=custom -> Strata at host.docker.internal:8080/v1, or Unsloth at
      # :8890/v1; set by scripts/start-strata.sh and start-unsloth.sh).
      - hermes-data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-sid}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    restart: unless-stopped

volumes:
  open-webui:
  hermes-data:
    name: sid-local-ai_hermes-data
    external: true   # created by scripts/start-hermes.sh
